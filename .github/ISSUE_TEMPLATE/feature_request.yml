name: 功能建议
description: 提出使用场景或交互改进建议
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 想解决什么问题
      description: 描述实际使用场景和目前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的使用方式
      description: 可以描述入口、操作步骤和期望结果，不需要提供实现方案。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 补充或参考（可选）
      description: 可附去除私人信息的截图或链接。
